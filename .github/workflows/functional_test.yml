name: Functional

on:
  push:
    branches:
      - 'main'
    paths:
      - '**.py'
      - '.github/workflows/*.yml'
      - 'pyproject.toml'
      - 'setup.py'
      - 'setup.cfg'
  pull_request:
    paths:
      - '**.py'
      - '.github/workflows/*.yml'
      - 'pyproject.toml'
      - 'setup.py'
      - 'setup.cfg'
  workflow_dispatch:

jobs:
  basic-functional-tests:

    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ '3.10', '3.11', '3.12', '3.13'] # TODO:Update to 3.14 when triangle library adds support 

    steps:
    - uses: actions/checkout@v4

    - name: Setup Mamba environment for Python
      uses: mamba-org/setup-micromamba@v3
      with:
        environment-file: ./environment.yml
        environment-name: ocsmesh-env
        post-cleanup: 'none'
        generate-run-shell: false
        create-args: >-
          python=${{ matrix.python-version }}

    - name: Install other dependencies
      shell: bash -l {0}
      run: pip install .[testing]

    - name: Prepare example DEM
      if: runner.os != 'Windows'
      shell: bash -l {0}
      run: |
        wget https://chs.coast.noaa.gov/htdata/raster2/elevation/NCEI_ninth_Topobathy_2014_8483/northeast_sandy/ncei19_n40x75_w073x75_2015v1.tif -O /tmp/fullsize_dem.tif
        gdalwarp -tr 0.0005 0.0005 -r average -overwrite /tmp/fullsize_dem.tif /tmp/test_dem.tif

    - name: Export Conda environment
      if: runner.os != 'Windows'
      shell: bash -el {0}
      run: conda list > environment_py${{ matrix.python-version }}.yml

    - name: 'Upload conda environment'
      if: runner.os != 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: conda-environment-${{ matrix.python-version }}
        path: environment_py${{ matrix.python-version }}.yml
        retention-days: 7


    - name: 'Upload test dem'
      if: runner.os != 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: test-dem-${{ matrix.python-version }}
        path: /tmp/test_dem.tif
        retention-days: 7

    - name: Run geom build test
      if: runner.os != 'Windows'
      shell: bash -l {0}
      run: source tests/cli/build_geom.sh

    - name: 'Upload Geom build results'
      if: runner.os != 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: geom-build-results-${{ matrix.python-version }}
        path: test_shape
        retention-days: 7

    - name: Run hfun build test
      if: runner.os != 'Windows'
      shell: bash -l {0}
      run: source tests/cli/build_hfun.sh

    - name: 'Upload Hfun build results'
      if: runner.os != 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: hfun-build-results-${{ matrix.python-version }}
        path: test.2dm
        retention-days: 7

    - name: Run remesh test
      if: runner.os != 'Windows'
      shell: bash -l {0}
      run: source tests/cli/remesh_by_dem.sh

    - name: 'Upload remesh results'
      if: runner.os != 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: remesh-bydem-results-${{ matrix.python-version }}
        path: remeshed.2dm
        retention-days: 7
    # Ensure engines are installed so tests don't skip
    - name: Install Engine Dependencies
      shell: bash -l {0}
      run: pip install gmsh triangle
  
    - name: Run Python API tests
      if: ${{ !(runner.os == 'Linux' && matrix.python-version == '3.12') }}
      shell: bash -el {0}
      run: python -m unittest discover tests

    - name: Run Python API tests with coverage
      if: runner.os == 'Linux' && matrix.python-version == '3.12'
      shell: bash -el {0}
      run: python -m pytest tests/api --cov=ocsmesh --cov-report=xml

    - name: Upload coverage to Codecov
      if: runner.os == 'Linux' && matrix.python-version == '3.12'
      uses: codecov/codecov-action@v5
      with:
        files: coverage.xml
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false

    - name: Run MPI mode-property tests (non-mpi launcher)
      shell: bash -el {0}
      run: python -m pytest tests/api/test_mpi_mode_property.py -v

    - name: Run MPI Integration tests (mpiexec)
      shell: bash -el {0}
      run: FI_PROVIDER=tcp mpiexec -n 2 python -m pytest tests/api/mpi_write_hfun_test.py -v -s

    - name: Run MPI Failure Handling tests (mpiexec -n 2)
      shell: bash -el {0}
      run: FI_PROVIDER=tcp mpiexec -n 2 python -m pytest tests/api/mpi_failures_handling_test.py -v -s

    # Multi-tile tests: serial == parallel == MPI for every refinement type
    - name: Run multi-tile equivalence tests (mpiexec -n 3)
      if: runner.os != 'Windows'
      shell: bash -el {0}
      run: >
        FI_PROVIDER=tcp mpiexec -n 3 python -m pytest -p no:cacheprovider
        tests/api/test_hfun_clipped_equivalence.py
        tests/api/test_hfun_empty_features.py
        tests/api/test_hfun_composite_footprint.py
        tests/api/test_hfun_meshdata_cache.py
        tests/api/test_hfun_idle_stages.py
        tests/api/test_hfun_lambda_constraint.py
        tests/api/test_hfun_execution_mode_arg.py
        tests/api/test_hfun_feature_sources.py
        tests/api/test_hfun_distributed_detection.py
        tests/api/test_parallel_fail_fast.py
        tests/api/test_mpi_environment.py
